<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Confirmer mon inscription | Cadrivolt</title>
  <link rel="icon" href="./favicon.svg">
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #43221a 0%, #171719 49%, #0d0d0f 100%); color: #f8f8f8; }
    main { width: min(100%, 480px); padding: clamp(24px, 6vw, 42px); background: #1a1a1e; border: 1px solid #353438; border-radius: 24px; box-shadow: 0 22px 60px #0007; text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 70px; height: 70px; border-radius: 20px; background: #f16d36; color: #171719; font-size: 34px; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 8px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #ffab80; font-weight: 700; }
    h1 { margin: 0 0 16px; font-size: clamp(24px, 5vw, 32px); line-height: 1.2; }
    p { line-height: 1.6; color: #cfcdd0; margin: 0 auto 23px; max-width: 360px; }
    button, .link { display: block; width: 100%; padding: 14px 20px; background: #f16d36; color: #151313; border: 0; border-radius: 10px; text-decoration: none; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover, .link:hover { background: #ff9364; }
    button:disabled { opacity: .55; cursor: wait; }
    .link { margin-top: 12px; background: transparent; color: #fff; border: 1px solid #656166; }
    .link:hover { background: #323035; }
    footer { margin-top: 27px; font-size: 12px; color: #aaa5a9; }
    [hidden] { display: none !important; }
  </style>
  <script src="./config.js"></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <p class="eyebrow">Cadrivolt</p>
    <h1>Confirme ton inscription</h1>
    <p id="status" role="status" aria-live="polite">Clique sur le bouton pour confirmer ton adresse e-mail et activer ton compte Cadrivolt.</p>
    <button id="verify" type="button" hidden>Confirmer mon adresse e-mail</button>
    <a class="link" href="./" id="home">Retourner sur Cadrivolt</a>
    <footer>La passion automobile nous rassemble.</footer>
  </main>
  <script type="module">
    const message = document.getElementById('status');
    const button = document.getElementById('verify');
    const params = new URLSearchParams(location.search);
    const token_hash = params.get('token_hash');
    const type = params.get('type');
    if (!token_hash || type !== 'email') {
      message.textContent = 'Ce lien est incomplet ou incorrect. Demande un nouvel e-mail de confirmation depuis Cadrivolt.';
    } else {
      button.hidden = false;
      button.addEventListener('click', async () => {
        button.disabled = true;
        button.textContent = 'Confirmation en cours…';
        message.textContent = 'Nous vérifions ton adresse e-mail.';
        try {
          const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
          const cfg = window.CADRIVOLT_CONFIG;
          if (!cfg?.supabaseUrl || !cfg?.supabasePublishableKey) {
            throw new Error('Configuration de connexion indisponible.');
          }
          const supabase = createClient(cfg.supabaseUrl, cfg.supabasePublishableKey);
          const { error } = await supabase.auth.verifyOtp({ token_hash, type: 'email' });
          if (error) throw error;
          history.replaceState(null, '', location.pathname);
          button.hidden = true;
          message.textContent = 'Ton adresse e-mail a bien été confirmée ! Tu peux maintenant accéder à Cadrivolt.';
        } catch (err) {
          message.textContent = 'La confirmation a échoué. Le lien est peut-être expiré ou déjà utilisé. Essaie de te connecter ou demande un nouvel e-mail de confirmation.';
          button.disabled = false;
          button.textContent = 'Réessayer la confirmation';
          console.error('Cadrivolt confirmation:', err?.message || err);
        }
      });
    }
  </script>
</body>
</html>
